<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Up io</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #071718;
            color: #ecfaf3;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        #game {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        #score {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2;
            min-width: 150px;
            padding: 15px 18px;
            border: 1px solid #6ce0c055;
            border-radius: 14px;
            background: linear-gradient(145deg, #102b2bf0, #0b1c22ed);
            color: #e7fff2;
            font-size: 22px;
            font-weight: 750;
            letter-spacing: .02em;
            box-shadow: 0 12px 32px #0006, inset 0 1px #ffffff0c;
            backdrop-filter: blur(12px);
        }
        #shop {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 2;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-width: min(700px, calc(100vw - 40px));
            padding: 14px;
            border: 1px solid #6ce0c044;
            border-radius: 16px;
            background: linear-gradient(145deg, #102b2bf0, #0b1c22ed);
            box-shadow: 0 12px 32px #0007, inset 0 1px #ffffff0c;
            backdrop-filter: blur(12px);
        }
        #shop::before {
            content: "FIELD UPGRADES";
            flex-basis: 100%;
            padding: 1px 4px 5px;
            color: #81b8a8;
            font: 700 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
            letter-spacing: .18em;
        }
        #shop button {
            flex: 1 1 145px;
            min-height: 46px;
            padding: 10px 13px;
            border: 1px solid #70dbc155;
            border-radius: 10px;
            background: linear-gradient(145deg, #173d3a, #122a31);
            color: #daf7eb;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            font-weight: 650;
            line-height: 1.3;
            transition: transform .16s, border-color .16s, background .16s, box-shadow .16s;
        }
        #shop button:hover {
            transform: translateY(-2px);
            border-color: #7ef0c8;
            background: linear-gradient(145deg, #20554c, #173843);
            box-shadow: 0 7px 18px #0005;
        }
        #shop button:active {
            transform: translateY(0);
        }
        @media (max-width: 520px) {
            #score { top: 12px; left: 12px; min-width: 0; padding: 11px 13px; font-size: 18px; }
            #shop { bottom: 12px; left: 12px; gap: 6px; max-width: calc(100vw - 24px); padding: 10px; }
            #shop button { flex-basis: 125px; min-height: 42px; padding: 8px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    <div id="shop">
        <button onclick="buyUpgrade('biggerHole')">Bigger Hole (10)</button>
        <button onclick="buyUpgrade('doublePoints')">Double Points (30)</button>
        <button onclick="buyUpgrade('autoCollector')">Auto Collector (40)</button>
    </div>
    <canvas id="game"></canvas>
    <script src="game.js"></script>
</body>
</html>
