<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Up io</title>
    <style>
        :root {
            color-scheme: dark;
            --mint: #73f0c8;
            --violet: #b69aff;
            --muted: #90b2ad;
            --panel: rgba(8, 24, 31, .9);
        }
        body {
            margin: 0;
            overflow: hidden;
            background: #071718;
            color: #ecfaf3;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }
        #game {
            display: block;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        #score {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2;
            min-width: 168px;
            padding: 13px 16px 14px;
            border: 1px solid #73f0c855;
            border-radius: 8px;
            background: linear-gradient(145deg, rgba(13, 38, 42, .94), var(--panel));
            box-shadow: 0 14px 36px #0007, inset 0 1px #ffffff10;
            backdrop-filter: blur(16px);
        }
        .score-label, .score-value, .score-unit { display: block; }
        .score-label, .score-unit {
            color: var(--muted);
            font: 700 9px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
            letter-spacing: .16em;
            text-transform: uppercase;
        }
        .score-value {
            margin-top: 4px;
            color: #f0fff8;
            font: 700 30px/1.05 ui-monospace, SFMono-Regular, Menlo, monospace;
            font-variant-numeric: tabular-nums;
        }
        .score-unit { margin-top: 4px; color: var(--mint); letter-spacing: .1em; }
        #shop {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(3, minmax(170px, 1fr));
            gap: 9px;
            width: min(740px, calc(100vw - 40px));
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #73f0c833;
            border-radius: 8px;
            background: linear-gradient(145deg, rgba(12, 34, 39, .94), var(--panel));
            box-shadow: 0 14px 36px #0008, inset 0 1px #ffffff0c;
            backdrop-filter: blur(16px);
        }
        .shop-heading {
            grid-column: 1 / -1;
            display: flex;
            align-items: baseline;
            justify-content: flex-start;
            padding: 1px 3px 3px;
        }
        .shop-heading span:first-child {
            color: var(--mint);
            font: 700 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
            letter-spacing: .18em;
        }
        #shop button {
            display: grid;
            align-content: start;
            justify-items: start;
            gap: 5px;
            min-width: 0;
            min-height: 94px;
            padding: 11px 12px;
            border: 1px solid #70dbc144;
            border-radius: 6px;
            background: linear-gradient(145deg, #153735, #10272d);
            color: #e4fff5;
            cursor: pointer;
            font-family: inherit;
            text-align: left;
            transition: transform .16s, border-color .16s, background .16s, box-shadow .16s, opacity .16s;
        }
        .upgrade-index, .upgrade-cost {
            color: var(--mint);
            font: 700 9px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
            letter-spacing: .1em;
            text-transform: uppercase;
        }
        .upgrade-title { font-size: 13px; font-weight: 700; }
        .upgrade-description { color: #9ab7b1; font-size: 10px; line-height: 1.25; }
        .upgrade-cost { margin-top: auto; color: #f5d995; letter-spacing: .05em; }
        #shop button:nth-of-type(2) .upgrade-index { color: var(--violet); }
        #shop button:nth-of-type(3) .upgrade-index { color: #ff9c83; }
        #shop button:not(:disabled):hover {
            transform: translateY(-3px);
            border-color: var(--mint);
            background: linear-gradient(145deg, #20554c, #173843);
            box-shadow: 0 8px 22px #0007;
        }
        #shop button:disabled {
            cursor: not-allowed;
            opacity: .58;
        }
        #shop button:focus-visible {
            outline: 2px solid #f5d995;
            outline-offset: 3px;
        }
        @media (max-width: 520px) {
            #score { top: 12px; left: 12px; min-width: 126px; padding: 10px 12px; }
            .score-value { font-size: 25px; }
            #shop { bottom: max(10px, env(safe-area-inset-bottom)); left: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; width: calc(100vw - 20px); padding: 8px; }
            .shop-heading { padding-bottom: 1px; }
            #shop button { min-height: 82px; padding: 8px 7px; gap: 4px; }
            .upgrade-title { font-size: 11px; }
            .upgrade-description { font-size: 9px; }
            .upgrade-index, .upgrade-cost { font-size: 8px; }
        }
    </style>
</head>
<body>
    <div id="score" role="status" aria-live="polite">
        <span class="score-label">Matter collected</span>
        <strong class="score-value" id="scoreValue">0</strong>
        <span class="score-unit">Energy points</span>
    </div>
    <div id="shop" aria-label="Field upgrades">
        <div class="shop-heading"><span>FIELD UPGRADES</span></div>
        <button type="button" data-upgrade="biggerHole" onclick="buyUpgrade('biggerHole')">
            <span class="upgrade-index">01 / Gravity</span><strong class="upgrade-title">Expand the void</strong>
            <span class="upgrade-description">Widen the collection radius</span><span class="upgrade-cost">10 points</span>
        </button>
        <button type="button" data-upgrade="doublePoints" onclick="buyUpgrade('doublePoints')">
            <span class="upgrade-index">02 / Yield</span><strong class="upgrade-title">Double the yield</strong>
            <span class="upgrade-description">Earn more per object</span><span class="upgrade-cost">30 points</span>
        </button>
        <button type="button" data-upgrade="autoCollector" onclick="buyUpgrade('autoCollector')">
            <span class="upgrade-index">03 / Orbit</span><strong class="upgrade-title">Auto collector</strong>
            <span class="upgrade-description">Pull nearby matter inward</span><span class="upgrade-cost">40 points</span>
        </button>
    </div>
    <canvas id="game"></canvas>
    <script src="game.js"></script>
</body>
</html>
