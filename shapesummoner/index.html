<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shape Summoner</title>
<style>
body { margin:0; overflow:hidden; background:#071019; color:#e8f4f1; font-family:Arial,sans-serif; }
button { font: inherit; }

canvas {
  display:block;
  width:100vw;
  height:100vh;
  touch-action:none;
  border:0;
  box-sizing:border-box;
  cursor:crosshair;
}

#saveHint {
  position:fixed;
  left:18px;
  bottom:16px;
  z-index:4;
  padding:10px 14px;
  border:1px solid #7de9bd44;
  border-radius:10px;
  background:linear-gradient(135deg,#10232be8,#0c171de8);
  color:#a9c8c2;
  font:11px "Courier New",monospace;
  letter-spacing:.04em;
  box-shadow:0 8px 26px #0005;
}

.controls-modal {
  position:fixed; inset:0; z-index:10; display:grid; place-items:center;
  padding:20px; background:rgba(0,0,0,.88); color:#fff; font-family:Arial,sans-serif;
}
.controls-dialog {
  width:min(460px,100%); padding:30px; border:1px solid #75e6a577; border-radius:16px;
  background:linear-gradient(145deg,#142b30,#101921); text-align:center; box-shadow:0 24px 80px #000a,0 0 40px #75e6a51c;
}
.controls-dialog h1 { margin:0 0 10px; color:#e7fff2; font-size:clamp(24px,6vw,38px); letter-spacing:.04em; }
.controls-dialog p { margin:0 0 22px; color:#9ebbb3; }
.control-options { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.control-options button { min-height:90px; border:1px solid #75e6a566; border-radius:10px; background:linear-gradient(140deg,#1c3836,#17252d); color:white; cursor:pointer; transition:transform .16s,border-color .16s,box-shadow .16s; }
.control-options button:hover { transform:translateY(-3px); border-color:#75e6a5; box-shadow:0 10px 24px #0005; }
.control-options strong,.control-options span { display:block; }
.control-options strong { margin-bottom:7px; color:#75e6a5; }
.control-options span { font-size:12px; }
.mobile-controls { display:none; }
body.mobile-mode .mobile-controls { display:flex; }
.mobile-controls { position:fixed; inset:0; z-index:5; justify-content:space-between; align-items:flex-end; padding:16px; pointer-events:none; font-family:Arial,sans-serif; }
.virtual-stick { position:relative; width:112px; height:112px; margin:0 0 4px 4px; border:2px solid #75e6a577; border-radius:50%; background:radial-gradient(circle,#75e6a522,#102027aa); box-shadow:0 0 24px #75e6a51c,inset 0 0 20px #75e6a51a; pointer-events:auto; touch-action:none; }
.virtual-stick-knob { position:absolute; top:50%; left:50%; width:48px; height:48px; border:2px solid #75e6a5; border-radius:50%; background:#75e6a555; transform:translate(-50%,-50%); pointer-events:none; }
.mobile-action-pad { display:grid; grid-template-columns:repeat(2,64px); gap:7px; pointer-events:auto; }
.mobile-action-pad button { min-height:48px; padding:4px; border:1px solid #75e6a577; border-radius:10px; background:linear-gradient(145deg,#19353aee,#101a22ee); color:#d8f6eb; font-size:10px; font-weight:700; letter-spacing:.04em; box-shadow:0 6px 18px #0007; touch-action:none; }
.mobile-action-pad button:active,.mobile-action-pad .selected { border-color:#75e6a5; background:linear-gradient(145deg,#75e6a5,#39af9a); color:#071019; }
body.mobile-mode #saveHint { display:none; }
@media(max-width:520px) { .controls-dialog { padding:24px 18px; } .mobile-controls { padding:10px; } .virtual-stick { width:96px;height:96px; } .virtual-stick-knob { width:42px;height:42px; } .mobile-action-pad { grid-template-columns:repeat(2,56px); gap:5px; } .mobile-action-pad button { min-height:42px;font-size:10px; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="saveHint">Press [F] to save — auto‑save every 10s — [ESC] for pause</div>
<div id="controlsModal" class="controls-modal">
  <div class="controls-dialog" role="dialog" aria-modal="true" aria-labelledby="controlsTitle">
    <h1 id="controlsTitle">Choose your controls</h1>
    <p>Pick how you want to play Shape Summoner.</p>
    <div class="control-options">
      <button type="button" data-control-mode="mobile"><strong>Mobile</strong><span>Joystick + action buttons</span></button>
      <button type="button" data-control-mode="computer"><strong>Computer</strong><span>WASD + keyboard and mouse</span></button>
    </div>
  </div>
</div>
<div id="mobileControls" class="mobile-controls" aria-label="Mobile game controls">
  <div id="moveStick" class="virtual-stick" aria-label="Movement joystick"><div class="virtual-stick-knob"></div></div>
  <div class="mobile-action-pad">
    <button type="button" data-shape="1" class="selected">CIRCLE</button>
    <button type="button" data-shape="2">SQUARE</button>
    <button type="button" data-shape="3">TRIANGLE</button>
    <button type="button" data-shape="4">STAR</button>
    <button type="button" id="mobileFire">FIRE</button>
    <button type="button" id="mobileSummon">SUMMON</button>
    <button type="button" id="mobilePause">PAUSE</button>
  </div>
</div>

<script>
const c = document.getElementById("game");
const x = c.getContext("2d");
const stars = Array.from({ length: 110 }, () => ({
  x: Math.random(),
  y: Math.random(),
  radius: .4 + Math.random() * 1.2,
  phase: Math.random() * Math.PI * 2
}));

function resize() {
  c.width = innerWidth;
  c.height = innerHeight;
}
resize();
onresize = resize;

// PLAYER
const p = {
  x: c.width/2,
  y: c.height/2,
  r: 20,
  s: 5,
  col: "white",
  hp: 100,
  maxHp: 100,
  regen: 0.1,
  mana: 50,
  maxMana: 50,
  mRegen: 0.2,
  lvl: 1,
  xp: 0,
  xpNext: 20,
  dmg: 1,
  sCost: 5,
  shCost: 3,
  spdBoost: 0,
  multi: false,
  multiCount: 2,
  shootCooldown: 0,
  shootDelay: 10
};

// GAME STATE
let boss = null;
let shots = [];
let bShots = [];
let sums = [];
let keys = {};
let shape = 1;
let lastX = p.x;
let lastY = p.y;
let dead = false;
let choose = false;
let cards = [];
let bossDropText = "";
let paused = false;
let currentSlot = 1;
let controlsChosen = false;
let controlMode = null;

// UPGRADES
const upgrades = [
  { name:"Max HP + Heal", apply(){ p.maxHp+=20; p.hp=p.maxHp; }},
  { name:"Max Mana + Restore", apply(){ p.maxMana+=20; p.mana=p.maxMana; }},
  { name:"Shot Damage Up", apply(){ p.dmg+=1; }},
  { name:"Regen Boost", apply(){ p.regen+=0.05; p.mRegen+=0.1; }},
  { name:"Move Speed Up", apply(){ p.s+=0.5; }},
  { name:"Summon HP Up", apply(){ sums.forEach(s=>s.hp+=10); }},
  { name:"Summon Radius Up", apply(){ sums.forEach(s=>s.r+=5); }},
  { name:"Mana Efficiency", apply(){ p.sCost=Math.max(1,p.sCost-1); p.shCost=Math.max(1,p.shCost-1); }},
  { name:"Projectile Speed Up", apply(){ p.spdBoost+=1; }},
  { name:"Multi-Shot +1", apply(){ p.multi=true; p.multiCount+=1; }},
  { name:"Faster Shooting", apply(){ p.shootDelay=Math.max(3,p.shootDelay-2); }}
];

const godUpgrades = [
  { name:"God Power: +2 DMG", apply(){ p.dmg+=2; }},
  { name:"God Speed: +2 SPD", apply(){ p.s+=2; }},
  { name:"God Mana: +20 Max Mana", apply(){ p.maxMana+=20; p.mana=p.maxMana; }},
  { name:"God Vitality: +10 HP", apply(){ p.maxHp+=10; p.hp=p.maxHp; }},
  { name:"God Regen: +30% Mana Regen", apply(){ p.mRegen*=1.3; }},
  { name:"God Regen: +20% HP Regen", apply(){ p.regen*=1.2; }}
];

const dragonUpgrades = [
  { name:"Dragon Fury: +5 DMG", apply(){ p.dmg+=5; }},
  { name:"Dragon Speed: +5 SPD", apply(){ p.s+=5; }},
  { name:"Dragon Breath: Infinite Mana", apply(){ p.maxMana=999999; p.mana=p.maxMana; }},
  { name:"Dragon Multishot +3", apply(){ p.multi=true; p.multiCount+=3; }},
  { name:"Dragon Skin: +15 HP", apply(){ p.maxHp+=15; p.hp=p.maxHp; }},
  { name:"Dragon Heart: +50% Mana Regen", apply(){ p.mRegen*=1.5; }}
];

// MOUSE
onmousemove = e => {
  lastX = e.clientX;
  lastY = e.clientY;
};

// SAVE SLOTS
function getSaveKey() {
  return "shapeSummonerSave_slot" + currentSlot;
}

function saveGame() {
  const data = { p };
  localStorage.setItem(getSaveKey(), JSON.stringify(data));
}

function loadGame() {
  const raw = localStorage.getItem(getSaveKey());
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    Object.assign(p, data.p);
  } catch(e) {}
}

loadGame();
setInterval(saveGame, 10000);

// BOSS SYSTEM
function godShot(boss) {
  const a = Math.atan2(p.y - boss.y, p.x - boss.x);
  bShots.push({ x: boss.x, y: boss.y, r: 50, sp: 3, dx: Math.cos(a), dy: Math.sin(a), col: "yellow", dmg: 8 });
}

function dragonShot(boss) {
  const base = Math.atan2(p.y - boss.y, p.x - boss.x);
  const spread = 0.4;
  for (let i = -1; i <= 1; i++) {
    const a = base + spread * i;
    bShots.push({ x: boss.x, y: boss.y, r: 65, sp: 2.5, dx: Math.cos(a), dy: Math.sin(a), col: "orange", dmg: 10 });
  }
}

function bossShoot(boss) {
  if (boss.type === "god") return godShot(boss), boss.cd = 70;
  if (boss.type === "dragon") return dragonShot(boss), boss.cd = 90;

  const a = Math.atan2(p.y - boss.y, p.x - boss.x);
  bShots.push({
    x: boss.x, y: boss.y, r: 8, sp: 5,
    dx: Math.cos(a), dy: Math.sin(a),
    col: boss.elite ? "magenta" : "orange",
    dmg: boss.elite ? 4 : 2
  });
  boss.cd = boss.elite ? 40 : 60;
}

function spawnBoss() {
  const roll = Math.random();

  if (roll < 0.80) {
    boss = { x:Math.random()*c.width, y:Math.random()*c.height, r:50, hp:15, maxHp:15, s:2, col:"red", elite:false, cd:0, type:"normal" };
    return;
  }

  if (roll < 0.95) {
    boss = { x:Math.random()*c.width, y:Math.random()*c.height, r:70, hp:40, maxHp:40, s:3, col:"purple", elite:true, cd:0, type:"elite" };
    return;
  }

  if (roll < 0.99) {
    boss = { x:Math.random()*c.width, y:Math.random()*c.height, r:150, hp:1200, maxHp:120, s:4, col:"gold", elite:false, cd:0, type:"god" };
    return;
  }

  boss = { x:Math.random()*c.width, y:Math.random()*c.height, r:180, hp:5000, maxHp:180, s:4.5, col:"darkgreen", elite:false, cd:0, type:"dragon" };
}

setInterval(() => {
  if (controlsChosen && !boss && !dead && !choose && !paused) spawnBoss();
}, 6000);

document.querySelectorAll("[data-control-mode]").forEach(button => {
  button.addEventListener("click", () => {
    controlMode = button.dataset.controlMode;
    controlsChosen = true;
    document.getElementById("controlsModal").remove();
    document.body.classList.toggle("mobile-mode", controlMode === "mobile");
    if (controlMode === "mobile") lastX = p.x + 100;
  });
});

const moveStick = document.getElementById("moveStick");
const moveKnob = moveStick.querySelector(".virtual-stick-knob");
let stickPointer = null;
function moveJoystick(event) {
  const bounds = moveStick.getBoundingClientRect();
  const limit = bounds.width * .34;
  const dx = event.clientX - (bounds.left + bounds.width / 2);
  const dy = event.clientY - (bounds.top + bounds.height / 2);
  const length = Math.hypot(dx, dy);
  const scale = length > limit ? limit / length : 1;
  const x = dx * scale, y = dy * scale;
  moveKnob.style.transform = `translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;
  keys.d = x > 10; keys.a = x < -10; keys.s = y > 10; keys.w = y < -10;
  if (Math.hypot(x, y) > 10) {
    const angle = Math.atan2(y, x);
    lastX = p.x + Math.cos(angle) * 100;
    lastY = p.y + Math.sin(angle) * 100;
  }
}
function resetJoystick() {
  stickPointer = null;
  moveKnob.style.transform = "translate(-50%,-50%)";
  keys.w = keys.a = keys.s = keys.d = false;
}
moveStick.addEventListener("pointerdown", event => {
  event.preventDefault(); stickPointer = event.pointerId;
  moveStick.setPointerCapture(stickPointer); moveJoystick(event);
});
moveStick.addEventListener("pointermove", event => { if (event.pointerId === stickPointer) moveJoystick(event); });
moveStick.addEventListener("pointerup", resetJoystick);
moveStick.addEventListener("pointercancel", resetJoystick);
document.querySelectorAll("[data-shape]").forEach(button => button.addEventListener("click", event => {
  event.stopPropagation(); shape = Number(button.dataset.shape);
  document.querySelectorAll("[data-shape]").forEach(option => option.classList.toggle("selected", option === button));
}));
document.getElementById("mobileFire").addEventListener("pointerdown", event => {
  event.preventDefault();
  event.stopPropagation();
  const target = boss;
  if (target) {
    lastX = target.x;
    lastY = target.y;
  }
  shoot();
});
function summonInFront() {
  const angle = Math.atan2(lastY - p.y, lastX - p.x);
  const x = Math.max(20, Math.min(c.width - 20, p.x + Math.cos(angle) * 110));
  const y = Math.max(20, Math.min(c.height - 20, p.y + Math.sin(angle) * 110));
  summonAt(x, y);
}
document.getElementById("mobileSummon").addEventListener("pointerdown", event => {
  event.preventDefault(); event.stopPropagation(); summonInFront();
});
document.getElementById("mobilePause").addEventListener("pointerdown", event => {
  event.preventDefault(); event.stopPropagation(); paused = !paused;
  event.currentTarget.textContent = paused ? "RESUME" : "PAUSE";
});

// INPUT
onkeydown = e => {
  if (!controlsChosen) return;
  keys[e.key] = true;

  if (e.key === "Escape") {
    paused = !paused;
    return;
  }

  if (paused) return;

  if (e.key === "f" || e.key === "F") saveGame();

  if (choose) return;

  if (e.key==="1") shape=1;
  if (e.key==="2") shape=2;
  if (e.key==="3") shape=3;
  if (e.key==="4") shape=4;
  if (e.key===" ") shoot();
};

onkeyup = e => keys[e.key] = false;

function offerCards() {
  choose = true;
  cards = [];
  while (cards.length < 3) {
    const cUp = upgrades[Math.floor(Math.random()*upgrades.length)];
    if (!cards.includes(cUp)) cards.push(cUp);
  }
}

function offerGodCards() {
  choose = true;
  cards = [];
  while (cards.length < 3) {
    const cUp = godUpgrades[Math.floor(Math.random()*godUpgrades.length)];
    if (!cards.includes(cUp)) cards.push(cUp);
  }
}

function offerDragonCards() {
  choose = true;
  cards = [];
  while (cards.length < 3) {
    const cUp = dragonUpgrades[Math.floor(Math.random()*dragonUpgrades.length)];
    if (!cards.includes(cUp)) cards.push(cUp);
  }
}

function summonAt(summonX, summonY) {
  if (dead || choose || paused || p.mana < p.sCost) return;
  p.mana -= p.sCost;
  sums.push({
    x: summonX, y: summonY, r: 20,
    col: `hsl(${Math.random()*360},80%,60%)`, sh: shape, hp: 10
  });
  fuseSummons();
}

onclick = e => {
  if (e.target.closest("#mobileControls, #controlsModal")) return;
  if (paused) {
    const w = 200, h = 80, g = 40;
    const sx = c.width/2 - (w*1.5 + g);
    const y = 320;

    for (let i = 1; i <= 3; i++) {
      const xx = sx + (i-1)*(w+g);

      if (e.clientX >= xx && e.clientX <= xx+w &&
          e.clientY >= y && e.clientY <= y+h) {

        currentSlot = i;
        loadGame();
        paused = false;
        return;
      }
    }
    return;
  }

  if (choose) {
    const w=250,h=150,g=50;
    const sx = c.width/2 - (w*1.5 + g);
    const y = 250;

    for (let i=0;i<3;i++) {
      const xx = sx + i*(w+g);
      if (e.clientX>=xx && e.clientX<=xx+w &&
          e.clientY>=y && e.clientY<=y+h) {
        cards[i].apply();
        choose = false;
        saveGame();
        return;
      }
    }

    if (cards.length === 0) choose = false;
    return;
  }

  summonAt(e.clientX, e.clientY);
};

function shoot() {
  if (dead || choose || paused) return;
  if (p.shootCooldown > 0) return;
  if (p.mana < p.shCost) return;

  p.shootCooldown = p.shootDelay;
  p.mana -= p.shCost;

  const speed = 8 + p.spdBoost;
  const angle = Math.atan2(lastY - p.y, lastX - p.x);

  function makeShot(a) {
    shots.push({
      x: p.x, y: p.y, r: 12, sp: speed,
      dx: Math.cos(a), dy: Math.sin(a),
      col: `hsl(${Math.random()*360},80%,60%)`,
      sh: shape,
      dmg: p.dmg
    });
  }

  if (p.multi) {
    const n = p.multiCount;
    const spread = 0.25;
    for (let i = 0; i < n; i++) {
      const off = spread * ((i / (n - 1)) - 0.5);
      makeShot(angle + off);
    }
  } else {
    makeShot(angle);
  }
}

// UTIL
function drawSummon(s) {
  x.save();
  x.shadowColor = s.col;
  x.shadowBlur = Math.min(28, 10 + s.r * .3);
  const gradient = x.createRadialGradient(s.x - s.r * .3, s.y - s.r * .35, 1, s.x, s.y, s.r);
  gradient.addColorStop(0, "#ffffff");
  gradient.addColorStop(.16, s.col);
  gradient.addColorStop(1, "#101a2a");
  x.fillStyle = gradient;
  x.beginPath();
  x.arc(s.x, s.y, s.r, 0, Math.PI * 2);
  x.fill();
  x.shadowBlur = 0;
  x.strokeStyle = s.col;
  x.lineWidth = Math.max(1.5, s.r * .07);
  x.stroke();
  x.beginPath();
  x.arc(s.x - s.r * .3, s.y - s.r * .34, Math.max(1.5, s.r * .14), 0, Math.PI * 2);
  x.fillStyle = "rgba(255,255,255,.72)";
  x.fill();
  x.restore();
}

function fuseSummons() {
  for (let i = 0; i < sums.length; i++) {
    for (let j = i + 1; j < sums.length; j++) {
      const a = sums[i], b = sums[j];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < a.r + b.r) {
        a.r += b.r * 0.5;
        a.hp += b.hp;
        sums.splice(j, 1);
        j--;
      }
    }
  }
}

function levelUp() {
  p.lvl++;
  p.xp = 0;
  p.xpNext = Math.floor(p.xpNext * 1.5);
  p.maxHp += 10;
  p.hp = p.maxHp;
  p.maxMana += 10;
  p.mana = p.maxMana;
  p.dmg += 0.5;
  p.regen += 0.02;
  saveGame();
}

function rewardGod() {
  p.dmg += 10;
  p.maxHp += 50;
  p.hp = p.maxHp;
}

function rewardDragon() {
  p.dmg += 15;
  p.multi = true;
  p.multiCount += 3;
}

// UPDATE
function update() {
  if (paused) return;

  if (p.shootCooldown > 0) p.shootCooldown--;

  if (!dead && !choose) {
    if (keys["w"] || keys["W"]) p.y -= p.s;
    if (keys["s"] || keys["S"]) p.y += p.s;
    if (keys["a"] || keys["A"]) p.x -= p.s;
    if (keys["d"] || keys["D"]) p.x += p.s;
    p.hp = Math.min(p.maxHp, p.hp + p.regen);
    p.mana = Math.min(p.maxMana, p.mana + p.mRegen);
  }

  // PLAYER BORDER COLLISION
  if (p.x - p.r < 0) p.x = p.r;
  if (p.x + p.r > c.width) p.x = c.width - p.r;
  if (p.y - p.r < 0) p.y = p.r;
  if (p.y + p.r > c.height) p.y = c.height - p.r;

  // Boss movement
  if (boss && !dead && !choose) {
    let angle = Math.atan2(p.y - boss.y, p.x - boss.x);

    for (let i = 0; i < sums.length; i++) {
      const s = sums[i];
      const d = Math.hypot(boss.x - s.x, boss.y - s.y);
      if (d < boss.r + s.r) {
        s.hp -= 0.2;
        if (s.hp <= 0) {
          sums.splice(i, 1);
          i--;
        }
        angle += Math.PI / 2;
      }
    }

    boss.x += Math.cos(angle) * boss.s;
    boss.y += Math.sin(angle) * boss.s;

    // BOSS BORDER COLLISION
    if (boss.x - boss.r < 0) boss.x = boss.r;
    if (boss.x + boss.r > c.width) boss.x = c.width - boss.r;
    if (boss.y - boss.r < 0) boss.y = boss.r;
    if (boss.y + boss.r > c.height) boss.y = c.height - boss.r;

    boss.cd--;
    if (boss.cd <= 0) bossShoot(boss);
  }

  // Shots movement
  shots.forEach(s => {
    s.x += s.dx * s.sp;
    s.y += s.dy * s.sp;
  });

  // SHOT BORDER COLLISION
  shots = shots.filter(s =>
    s.x > s.r &&
    s.x < c.width - s.r &&
    s.y > s.r &&
    s.y < c.height - s.r
  );

  // Boss shots movement
  bShots.forEach(b => {
    b.x += b.dx * b.sp;
    b.y += b.dy * b.sp;
  });

  // BOSS SHOT BORDER COLLISION
  bShots = bShots.filter(b =>
    b.x > b.r &&
    b.x < c.width - b.r &&
    b.y > b.r &&
    b.y < c.height - b.r
  );

  // Summon border collision
  sums.forEach(s => {
    if (s.x - s.r < 0) s.x = s.r;
    if (s.x + s.r > c.width) s.x = c.width - s.r;
    if (s.y - s.r < 0) s.y = s.r;
    if (s.y + s.r > c.height) s.y = c.height - s.r;
  });

  // Player shots hit boss
  if (boss) {
    for (let i = shots.length - 1; i >= 0; i--) {
      const s = shots[i];
      const d = Math.hypot(s.x - boss.x, s.y - boss.y);
      if (d < s.r + boss.r) {
        boss.hp -= s.dmg;
        shots.splice(i, 1);

        if (boss.hp <= 0) {

          if (boss.type === "god") {
            rewardGod();            offerGodCards();
            bossDropText = "GOD REWARD!";
            setTimeout(() => bossDropText = "", 3000);
            saveGame();
            return;
          }

          if (boss.type === "dragon") {
            rewardDragon();
            boss = null;
            offerDragonCards();
            bossDropText = "DRAGON REWARD!";
            setTimeout(() => bossDropText = "", 3000);
            saveGame();
            return;
          }

          if (boss.type === "elite") {
            bossDropText = "";
            boss = null;
            p.xp += 15;
            if (p.xp >= p.xpNext) levelUp();
            offerCards();
            saveGame();
            return;
          }

          if (boss.type === "normal") {
            bossDropText = "";
            boss = null;
            p.xp += 10;
            if (p.xp >= p.xpNext) levelUp();
            saveGame();
            return;
          }
        }
      }
    }
  }

  // Boss shots hit player / summons
  for (let i = bShots.length - 1; i >= 0; i--) {
    const b = bShots[i];
    const dp = Math.hypot(b.x - p.x, b.y - p.y);

    if (dp < b.r + p.r) {
      p.hp -= b.dmg;
      bShots.splice(i, 1);
      if (p.hp <= 0) {
        p.hp = 0;
        dead = true;
        saveGame();
      }
      continue;
    }

    let hit = false;
    for (let j = 0; j < sums.length; j++) {
      const s = sums[j];
      const ds = Math.hypot(b.x - s.x, b.y - s.y);
      if (ds < b.r + s.r) {
        s.hp -= b.dmg;
        bShots.splice(i, 1);
        hit = true;
        if (s.hp <= 0) sums.splice(j, 1);
        break;
      }
    }
    if (hit) continue;
  }

  // Boss touches player
  if (boss && !dead && !choose) {
    const d = Math.hypot(p.x - boss.x, p.y - boss.y);
    if (d < p.r + boss.r) {
      p.hp -= 1;
      if (p.hp <= 0) {
        p.hp = 0;
        dead = true;
        saveGame();
      }
    }
  }
}

// DRAW
function draw() {
  x.setTransform(1,0,0,1,0,0);
  x.clearRect(0,0,c.width,c.height);
  const background = x.createLinearGradient(0, 0, c.width, c.height);
  background.addColorStop(0, "#091822");
  background.addColorStop(.55, "#101b2b");
  background.addColorStop(1, "#11162a");
  x.fillStyle = background;
  x.fillRect(0, 0, c.width, c.height);
  const ambient = x.createRadialGradient(c.width * .5, c.height * .48, 20, c.width * .5, c.height * .48, Math.max(c.width, c.height) * .7);
  ambient.addColorStop(0, "rgba(36,115,113,.13)");
  ambient.addColorStop(1, "rgba(3,8,14,.42)");
  x.fillStyle = ambient;
  x.fillRect(0, 0, c.width, c.height);
  const now = performance.now();
  stars.forEach(star => {
    const alpha = .2 + (Math.sin(now / 750 + star.phase) + 1) * .18;
    x.fillStyle = `rgba(207,255,237,${alpha})`;
    x.beginPath();
    x.arc(star.x * c.width, star.y * c.height, star.radius, 0, Math.PI * 2);
    x.fill();
  });
  x.strokeStyle = "rgba(129,211,191,.045)";
  x.lineWidth = 1;
  const gridSize = 48;
  for (let gridX = 0; gridX < c.width; gridX += gridSize) {
    x.beginPath(); x.moveTo(gridX, 0); x.lineTo(gridX, c.height); x.stroke();
  }
  for (let gridY = 0; gridY < c.height; gridY += gridSize) {
    x.beginPath(); x.moveTo(0, gridY); x.lineTo(c.width, gridY); x.stroke();
  }

  // PAUSE MENU
  if (paused) {
    x.fillStyle = "rgba(0,0,0,0.7)";
    x.fillRect(0,0,c.width,c.height);

    x.fillStyle = "white";
    x.font = "50px Arial";
    x.fillText("PAUSED", c.width/2 - 120, 150);

    x.font = "30px Arial";
    x.fillText("Select Save Slot:", c.width/2 - 150, 250);

    const w = 200, h = 80, g = 40;
    const sx = c.width/2 - (w*1.5 + g);
    const y = 320;

    for (let i = 1; i <= 3; i++) {
      const xx = sx + (i-1)*(w+g);

      x.fillStyle = (currentSlot === i) ? "#444" : "#222";
      x.fillRect(xx, y, w, h);

      x.strokeStyle = "white";
      x.strokeRect(xx, y, w, h);

      x.fillStyle = "white";
      x.fillText("Slot " + i, xx + 60, y + 50);
    }

    return;
  }

  // Player
  x.save();
  x.shadowColor = p.col;
  x.shadowBlur = 30;
  x.beginPath();
  x.arc(p.x,p.y,p.r,0,Math.PI*2);
  const playerGlow = x.createRadialGradient(p.x - 5, p.y - 6, 1, p.x, p.y, p.r);
  playerGlow.addColorStop(0, "#ffffff");
  playerGlow.addColorStop(.3, p.col);
  playerGlow.addColorStop(1, "#187d8c");
  x.fillStyle=playerGlow;
  x.fill();
  x.shadowBlur = 0;
  x.strokeStyle = "rgba(225,255,247,.9)";
  x.lineWidth = 2;
  x.stroke();
  x.restore();

  // Player HP bar
  x.fillStyle="rgba(3,10,16,.8)";
  x.fillRect(p.x-24,p.y-p.r-20,48,7);
  x.fillStyle="#ff647e";
  x.fillRect(p.x-22,p.y-p.r-18,44*Math.max(0,p.hp/p.maxHp),3);

  // Player Mana bar
  x.fillStyle="rgba(3,10,16,.8)";
  x.fillRect(p.x-24,p.y+p.r+10,48,7);
  x.fillStyle="#59e5ed";
  x.fillRect(p.x-22,p.y+p.r+12,44*Math.max(0,p.mana/p.maxMana),3);

  // XP
  x.fillStyle="rgba(5,14,23,.76)";
  x.fillRect(16,16,210,38);
  x.strokeStyle="rgba(125,233,189,.45)";
  x.strokeRect(16,16,210,38);
  x.fillStyle="#c9f6e4";
  x.font="600 14px Arial";
  x.fillText(`LEVEL ${p.lvl}`,28,40);
  x.fillStyle="#81a89f";
  x.font="12px Arial";
  x.fillText(`XP ${p.xp} / ${p.xpNext}`,105,40);

  // Summons + shots
  sums.forEach(drawSummon);
  shots.forEach(drawSummon);

  // Boss shots
  bShots.forEach(b=>{
    x.beginPath();
    x.arc(b.x,b.y,b.r,0,Math.PI*2);
    x.fillStyle=b.col;
    x.fill();
  });

  // Boss
  if (boss) {
    x.save();
    x.shadowColor=boss.col;
    x.shadowBlur=34;
    x.beginPath();
    x.arc(boss.x,boss.y,boss.r,0,Math.PI*2);
    const bossGlow=x.createRadialGradient(boss.x-boss.r*.3,boss.y-boss.r*.35,2,boss.x,boss.y,boss.r);
    bossGlow.addColorStop(0,"#fff2d1");
    bossGlow.addColorStop(.18,boss.col);
    bossGlow.addColorStop(1,"#2a101e");
    x.fillStyle=bossGlow;
    x.fill();
    x.shadowBlur=0;
    x.strokeStyle="rgba(255,224,178,.9)";
    x.lineWidth=3;
    x.stroke();
    x.restore();

    x.fillStyle="rgba(5,9,16,.86)";
    x.fillRect(boss.x-44,boss.y-boss.r-22,88,12);
    x.fillStyle="#fb667d";
    const bossHpWidth = Math.max(0,(boss.hp/boss.maxHp)*80);
    x.fillRect(boss.x-40,boss.y-boss.r-19,bossHpWidth,6);

    x.fillStyle="#ffe39a";
    x.font="700 13px Arial";
    x.textAlign="center";

    if (boss.type === "god") x.fillText("GOD", boss.x, boss.y - boss.r - 32);
    else if (boss.type === "dragon") x.fillText("DRAGON", boss.x, boss.y - boss.r - 32);
    else if (boss.type === "elite") x.fillText("ELITE", boss.x, boss.y - boss.r - 32);
    else x.fillText("BOSS", boss.x, boss.y - boss.r - 32);
    x.textAlign="left";
  }

  // Boss drop text
  if (bossDropText) {
    x.fillStyle="white";
    x.font="28px Arial";
    x.fillText(bossDropText, c.width/2 - 200, c.height - 80);
  }

  // Upgrade UI
  if (choose) {
    x.fillStyle="rgba(0,0,0,0.7)";
    x.fillRect(0,0,c.width,c.height);

    x.fillStyle="white";
    x.font="40px Arial";
    x.fillText("Choose an Upgrade", c.width/2 - 200, 150);

    const w=250,h=150,g=50;
    const sx=c.width/2-(w*1.5+g);
    const y=250;

    cards.forEach((card,i)=>{
      const xx=sx+i*(w+g);
      x.fillStyle="#222";
      x.fillRect(xx,y,w,h);

      x.strokeStyle="white";
      x.strokeRect(xx,y,w,h);

      x.fillStyle="white";
      x.font="24px Arial";
      x.fillText(card.name, xx+20, y+h/2);
    });

    if (cards.length === 0) choose = false;
  }

  // Death screen
  if (dead && !choose) {
    x.fillStyle="rgba(0,0,0,0.7)";
    x.fillRect(0,0,c.width,c.height);

    x.fillStyle="white";
    x.font="60px Arial";
    x.fillText("YOU DIED", c.width/2 - 150, c.height/2 - 40);

    x.font="30px Arial";
    x.fillText("Refresh page to restart", c.width/2 - 180, c.height/2 + 20);
  }
}

// GAME LOOP
function gameLoop() {
  if (controlsChosen) update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
