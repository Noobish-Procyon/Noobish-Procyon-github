<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fusion Lab</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #111;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(0,0,0,0.4);
      padding: 10px;
      border-radius: 8px;
      color: white;
      font-family: Arial;
    }
    button { margin: 2px; }
  </style>
</head>
<body>
  <div id="ui">
    <div>Fusion Energy: <span id="fusionEnergy">0</span></div>
    <div>Selected Circle: <span id="selectedCircle">None</span></div>
    <button id="battleBtn">Battle</button>
    <button id="fuseBtn">Fuse Selected + Random</button>
    <button id="saveBtn">Save</button>
    <button id="loadBtn">Load</button>
    <div id="circleList"></div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script src="circle.js"></script>
  <script src="enemy.js"></script>
  <script src="battleSystem.js"></script>
  <script src="fusionSystem.js"></script>
  <script src="saveSystem.js"></script>
  <script src="game.js"></script>
</body>
</html>
