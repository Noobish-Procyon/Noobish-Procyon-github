<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Circle Clash RTS</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #111;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(0,0,0,0.4);
      padding: 10px;
      border-radius: 8px;
      color: white;
      font-family: Arial;
      font-size: 12px;
    }
    button { margin: 2px; }
  </style>
</head>
<body>

  <div id="ui">
    <div>Coins: <span id="coins">0</span></div>
    <div>Wave: <span id="wave">1</span></div>
    <div>Bank Lv: <span id="bankLevel">1</span></div>

    <button data-unit="basic">Basic (10)</button>
    <button data-unit="shield">Shield (20)</button>
    <button data-unit="sword">Sword (25)</button>
    <button data-unit="headbanger">Headbanger (30)</button>
    <button data-unit="sniper">Sniper (35)</button>
    <button data-unit="cannon">Cannon (40)</button>
    <button data-unit="giant">Giant (60)</button>
    <button data-unit="speedshape">Speedshape (30)</button>

    <br>
    <button id="upgradeBankBtn">Upgrade Bank (50)</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script src="utils.js"></script>
  <script src="unit.js"></script>
  <script src="projectile.js"></script>
  <script src="enemyAI.js"></script>
  <script src="bank.js"></script>
  <script src="saveSystem.js"></script>
  <script src="game.js"></script>

</body>
</html>
